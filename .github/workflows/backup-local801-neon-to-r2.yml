name: backup-local801-neon-to-r2

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create encrypted-in-transit CAT dump and checksum
        env:
          LOCAL801_DATABASE_URL: ${{ secrets.LOCAL801_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${LOCAL801_DATABASE_URL:-}"
          case "${LOCAL801_DATABASE_URL}" in *sslmode=require*|*sslmode=verify-ca*|*sslmode=verify-full*) ;; *) echo "CAT backup database URL must require TLS" >&2; exit 1;; esac
          BACKUP_FILE="local801-$(date -u +%Y%m%dT%H%M%SZ).dump"
          docker run --rm -e LOCAL801_DATABASE_URL postgres:18 sh -c \
            'pg_dump --dbname="$LOCAL801_DATABASE_URL" --format=custom --compress=9 --no-owner --no-privileges' > "${BACKUP_FILE}"
          sha256sum "${BACKUP_FILE}" > "${BACKUP_FILE}.sha256"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"
      - name: Upload to dedicated CAT recovery bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LOCAL801_BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LOCAL801_BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          LOCAL801_BACKUP_R2_ENDPOINT: ${{ secrets.LOCAL801_BACKUP_R2_ENDPOINT }}
          LOCAL801_BACKUP_R2_BUCKET: ${{ secrets.LOCAL801_BACKUP_R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${LOCAL801_BACKUP_R2_ENDPOINT:-}" && test -n "${LOCAL801_BACKUP_R2_BUCKET:-}"
          aws s3 cp "${BACKUP_FILE}" "s3://${LOCAL801_BACKUP_R2_BUCKET}/database/${BACKUP_FILE}" --endpoint-url "${LOCAL801_BACKUP_R2_ENDPOINT}"
          aws s3 cp "${BACKUP_FILE}.sha256" "s3://${LOCAL801_BACKUP_R2_BUCKET}/database/${BACKUP_FILE}.sha256" --endpoint-url "${LOCAL801_BACKUP_R2_ENDPOINT}"
      - name: Emit CAT backup failure signal
        if: failure()
        run: |
          echo '[local801-security] {"event":"backup.failure","component":"database_backup","outcome":"failed"}'
          echo "::error title=Local 801 CAT backup failed::Review this CAT-only workflow run and the backup recovery blocker."
