name: local801-r2-recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inventory, dry-run, ciphertext copy, or synthetic key-read/cleanup drill
        required: true
        default: inventory
        type: choice
        options: [inventory, dry-run, copy, key-read-test]
      confirmation:
        description: Exact typed confirmation required only for key-read-test
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: local801-r2-recovery
  cancel-in-progress: false

jobs:
  recover-encrypted-cat-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/local801-engage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/local801-engage/package-lock.json
      - run: npm ci
      - name: Inventory or copy CAT ciphertext
        if: inputs.mode != 'key-read-test'
        env:
          LOCAL801_R2_RECOVERY_SOURCE_ACCOUNT_ID: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_ACCOUNT_ID }}
          LOCAL801_R2_RECOVERY_SOURCE_ENDPOINT: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_ENDPOINT }}
          LOCAL801_R2_RECOVERY_SOURCE_BUCKET: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_BUCKET }}
          LOCAL801_R2_RECOVERY_SOURCE_ACCESS_KEY_ID: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_ACCESS_KEY_ID }}
          LOCAL801_R2_RECOVERY_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_SECRET_ACCESS_KEY }}
          LOCAL801_R2_RECOVERY_DESTINATION_ACCOUNT_ID: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_ACCOUNT_ID }}
          LOCAL801_R2_RECOVERY_DESTINATION_ENDPOINT: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_ENDPOINT }}
          LOCAL801_R2_RECOVERY_DESTINATION_BUCKET: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_BUCKET }}
          LOCAL801_R2_RECOVERY_DESTINATION_ACCESS_KEY_ID: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_ACCESS_KEY_ID }}
          LOCAL801_R2_RECOVERY_DESTINATION_SECRET_ACCESS_KEY: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_SECRET_ACCESS_KEY }}
          LOCAL801_R2_RECOVERY_BATCH_SIZE: ${{ vars.LOCAL801_R2_RECOVERY_BATCH_SIZE }}
          LOCAL801_R2_RECOVERY_COPY: ${{ vars.LOCAL801_R2_RECOVERY_COPY }}
          LOCAL801_R2_RECOVERY_CONFIRMATION: ${{ vars.LOCAL801_R2_RECOVERY_CONFIRMATION }}
        run: npm run recovery:r2 -- --mode=${{ inputs.mode }}
      - name: Test synthetic encrypted-object recovery and exact cleanup
        if: inputs.mode == 'key-read-test'
        env:
          LOCAL801_R2_RECOVERY_SOURCE_ACCOUNT_ID: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_ACCOUNT_ID }}
          LOCAL801_R2_RECOVERY_SOURCE_ENDPOINT: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_ENDPOINT }}
          LOCAL801_R2_RECOVERY_SOURCE_BUCKET: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_BUCKET }}
          LOCAL801_R2_RECOVERY_SOURCE_ACCESS_KEY_ID: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_ACCESS_KEY_ID }}
          LOCAL801_R2_RECOVERY_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.LOCAL801_R2_RECOVERY_SOURCE_SECRET_ACCESS_KEY }}
          LOCAL801_R2_RECOVERY_DRILL_SOURCE_ACCESS_KEY_ID: ${{ secrets.LOCAL801_R2_RECOVERY_DRILL_SOURCE_ACCESS_KEY_ID }}
          LOCAL801_R2_RECOVERY_DRILL_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.LOCAL801_R2_RECOVERY_DRILL_SOURCE_SECRET_ACCESS_KEY }}
          LOCAL801_R2_RECOVERY_DESTINATION_ACCOUNT_ID: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_ACCOUNT_ID }}
          LOCAL801_R2_RECOVERY_DESTINATION_ENDPOINT: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_ENDPOINT }}
          LOCAL801_R2_RECOVERY_DESTINATION_BUCKET: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_BUCKET }}
          LOCAL801_R2_RECOVERY_DESTINATION_ACCESS_KEY_ID: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_ACCESS_KEY_ID }}
          LOCAL801_R2_RECOVERY_DESTINATION_SECRET_ACCESS_KEY: ${{ secrets.LOCAL801_R2_RECOVERY_DESTINATION_SECRET_ACCESS_KEY }}
          LOCAL801_R2_RECOVERY_ENCRYPTION_MASTER_KEYS: ${{ secrets.LOCAL801_R2_RECOVERY_ENCRYPTION_MASTER_KEYS }}
          LOCAL801_R2_RECOVERY_ACTIVE_ENCRYPTION_KEY_VERSION: ${{ secrets.LOCAL801_R2_RECOVERY_ACTIVE_ENCRYPTION_KEY_VERSION }}
          LOCAL801_R2_RECOVERY_BATCH_SIZE: ${{ vars.LOCAL801_R2_RECOVERY_BATCH_SIZE }}
          LOCAL801_R2_RECOVERY_KEY_READ_TEST: "1"
          LOCAL801_R2_RECOVERY_KEY_READ_CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run recovery:r2:key-read-test
