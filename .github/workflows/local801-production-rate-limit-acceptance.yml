name: local801-production-rate-limit-acceptance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN LOCAL801 PRODUCTION RATE LIMIT ACCEPTANCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: local801-production-rate-limit-acceptance
  cancel-in-progress: false

jobs:
  accept-production-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/local801-engage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/local801-engage/package-lock.json
      - run: npm ci
      - name: Verify Production limiter and exact synthetic cleanup
        env:
          LOCAL801_MIGRATION_DATABASE_URL: ${{ secrets.LOCAL801_MIGRATION_DATABASE_URL }}
          LOCAL801_RATE_LIMIT_DRILL_APP_DATABASE_URL: ${{ secrets.LOCAL801_RATE_LIMIT_DRILL_APP_DATABASE_URL }}
          LOCAL801_PRODUCTION_LAUNCH_ENABLED: "0"
          LOCAL801_PRODUCTION_RATE_LIMIT_ACCEPTANCE: "1"
          LOCAL801_PRODUCTION_RATE_LIMIT_CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run security:accept-production-rate-limit
